server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # API（/api/* → backend）
  location /api/ {
    proxy_pass http://buff-backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # サブパスで試したい時用（/buff_sim1/api/* → backendの /api/*）
  location ^~ /buff_sim1/api/ {
    proxy_pass http://buff-backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # healthz も確認しやすく
  location = /healthz { proxy_pass http://buff-backend:8000/healthz; }
  location = /buff_sim1/healthz { proxy_pass http://buff-backend:8000/healthz; }

  # SPA（React）のためのフォールバック
  location /buff_sim1/ { try_files $uri $uri/ /index.html; }
  location / { try_files $uri $uri/ /index.html; }
}
