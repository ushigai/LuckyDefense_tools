# buff_sim1 を Caddyなしでローカル検証するための compose（本番build→nginx配信）
#
# 起動:
#   docker compose -f docker-compose-buff.yaml up -d --build
#
# 確認:
#   UI      : http://localhost:8080/
#   UI(sub) : http://localhost:8080/buff_sim1/
#   backend : http://localhost:8001/healthz

services:
  buff-backend:
    build: ./buff_sim1/backend
    restart: unless-stopped
    ports:
      - "8001:8000"

  # フロントを production build して dist を共有ボリュームへ吐く
  buff-frontend-build:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./buff_sim1/frontend:/app
      - buff_dist:/out
    command: >
      sh -lc "set -eu;
              if [ -f package-lock.json ]; then npm ci; else npm install; fi;
              npm run build -- --base /;
              rm -rf /out/*;
              cp -r dist/* /out/"
    restart: "no"

  # dist を配信しつつ /api を backend へ reverse proxy
  buff-web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - buff_dist:/usr/share/nginx/html:ro
      - ./buff_sim1/nginx/buff.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      buff-frontend-build:
        condition: service_completed_successfully
      buff-backend:
        condition: service_started

volumes:
  buff_dist:
